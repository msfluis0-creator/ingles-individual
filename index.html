<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ingles individual</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{width:100%;height:100%}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;overflow:hidden}
        .screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;z-index:100}
        .screen.active{display:flex}
        .login{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);justify-content:center;align-items:center;padding:20px}
        .card{background:white;border-radius:20px;padding:40px 30px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        .card h1{font-size:28px;font-weight:700;text-align:center;margin-bottom:8px}
        .card p{color:#999;text-align:center;font-size:14px;margin-bottom:30px}
        .tabs{display:flex;gap:8px;margin-bottom:25px;border-bottom:2px solid #e5e5ea}
        .tabs button{flex:1;padding:12px;background:0;border:0;font-weight:600;font-size:14px;cursor:pointer;color:#999;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit}
        .tabs button.active{color:#007AFF;border-bottom-color:#007AFF}
        .mode{display:none}
        .mode.active{display:block}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-weight:600;margin-bottom:8px;font-size:13px}
        .form-group input,.form-group select{width:100%;padding:12px;border:1px solid #e5e5ea;border-radius:12px;font-size:16px;font-family:inherit}
        .form-group input:focus,.form-group select:focus{outline:0;border-color:#007AFF;box-shadow:0 0 0 3px rgba(0,122,255,0.1)}
        .btn{width:100%;padding:14px;background:#007AFF;color:white;border:0;border-radius:12px;font-weight:600;cursor:pointer;font-size:15px;font-family:inherit;margin-bottom:8px}
        .btn:active{opacity:0.8}
        .btn-secondary{background:#34C759}
        .app{background:white}
        .header{background:white;padding:12px 16px;border-bottom:1px solid #e5e5ea;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
        .header h2{font-size:18px;font-weight:700}
        .header-right{text-align:right}
        .user-name{font-size:13px;font-weight:600;margin-bottom:4px}
        .logout-btn{padding:6px 12px;background:#ff3b30;color:white;border:0;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
        .nav{display:flex;gap:0;border-bottom:1px solid #e5e5ea;overflow-x:auto;background:white;flex-shrink:0;-webkit-overflow-scrolling:touch}
        .nav button{flex-shrink:0;padding:12px 14px;background:0;border:0;font-weight:500;font-size:12px;cursor:pointer;color:#999;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
        .nav button.active{color:#007AFF;border-bottom-color:#007AFF}
        .content{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
        .section{background:white;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e5e5ea}
        .section h3{font-size:15px;font-weight:700;margin-bottom:16px}
        .item{background:#f5f5f5;border-radius:12px;padding:12px;margin-bottom:12px;border-left:4px solid #007AFF}
        .item h4{font-size:13px;font-weight:600;margin-bottom:4px}
        .item p{font-size:12px;color:#999;margin:2px 0}
        .msg{padding:12px;border-radius:12px;margin-bottom:12px;display:none;font-size:13px;font-weight:600}
        .msg.show{display:block}
        .msg.success{background:#d1fae5;color:#065f46}
        .msg.error{background:#fee2e2;color:#991b1b}
        .pane{display:none}
        .pane.active{display:block}
        table{width:100%;border-collapse:collapse;font-size:12px}
        table th{background:#f5f5f5;padding:10px;text-align:left;font-weight:600;border-bottom:1px solid #e5e5ea}
        table td{padding:10px;border-bottom:1px solid #e5e5ea}
        .empty{color:#999;font-size:12px;text-align:center;padding:20px}
        .sync-code{background:#f0f0f0;padding:12px;border-radius:8px;font-family:monospace;font-size:11px;word-break:break-all;margin:8px 0}
    </style>
</head>
<body>
    <div class="screen login active" id="login">
        <div class="card">
            <h1>📊 Ingles</h1>
            <p>Dashboard Ventas</p>
            <div class="tabs">
                <button class="active" onclick="switchMode('vendor')">Vendedor</button>
                <button onclick="switchMode('admin')">Admin</button>
            </div>
            <div class="mode active" id="vendor-mode">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="vname" placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label>Código</label>
                    <input type="text" id="vcode" placeholder="Código">
                </div>
                <button class="btn" onclick="loginVendor()">Entrar</button>
            </div>
            <div class="mode" id="admin-mode">
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="apass" placeholder="">
                </div>
                <button class="btn" onclick="loginAdmin()">Entrar</button>
            </div>
        </div>
    </div>
    
    <div class="screen app" id="app">
        <div class="header">
            <h2>📊</h2>
            <div class="header-right">
                <div class="user-name" id="user"></div>
                <button class="logout-btn" onclick="logout()">Salir</button>
            </div>
        </div>
        <div class="nav" id="nav">
            <button class="active" onclick="tab('reg')">+ Reg</button>
            <button onclick="tab('pros')">👥 Pros</button>
            <button onclick="tab('calls')">☎️ Llam</button>
            <button onclick="tab('apt')">📅 Citas</button>
            <button onclick="tab('info')">📋 Infos</button>
            <button onclick="tab('close')">✓ Cier</button>
        </div>
        <div class="content">
            <div id="reg" class="pane active">
                <div class="section">
                    <div class="msg" id="msg"></div>
                    <h3>Nuevo Prospecto</h3>
                    <form onsubmit="addProspect(event)">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" id="pn" required>
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="pp" required>
                        </div>
                        <button type="submit" class="btn">Registrar</button>
                    </form>
                </div>
            </div>
            <div id="pros" class="pane">
                <div class="section">
                    <h3>Mis Prospectos</h3>
                    <div id="pros-list"></div>
                </div>
            </div>
            <div id="calls" class="pane">
                <div class="section">
                    <h3>Registrar Llamada</h3>
                    <form onsubmit="addCall(event)">
                        <div class="form-group">
                            <label>Prospecto</label>
                            <select id="cp" required><option value="">Selecciona...</option></select>
                        </div>
                        <div class="form-group">
                            <label>Resultado</label>
                            <select id="cr" required>
                                <option value="">Selecciona...</option>
                                <option value="Colgó">Colgó</option>
                                <option value="Llamar después">Llamar después</option>
                                <option value="Citado">Citado</option>
                                <option value="No responde">No responde</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">Registrar</button>
                    </form>
                </div>
                <div class="section">
                    <h3>Historial</h3>
                    <div id="calls-list"></div>
                </div>
            </div>
            <div id="apt" class="pane">
                <div class="section">
                    <h3>Agendar Cita</h3>
                    <form onsubmit="addApt(event)">
                        <div class="form-group">
                            <label>Prospecto</label>
                            <select id="ap" required><option value="">Selecciona...</option></select>
                        </div>
                        <div class="form-group">
                            <label>Fecha</label>
                            <input type="date" id="ad" required>
                        </div>
                        <div class="form-group">
                            <label>Hora</label>
                            <input type="time" id="at" required>
                        </div>
                        <div class="form-group">
                            <label>Tipo</label>
                            <select id="atype" required>
                                <option value="">Selecciona...</option>
                                <option value="Presencial">Presencial</option>
                                <option value="Virtual">Virtual</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">Agendar</button>
                    </form>
                </div>
                <div class="section">
                    <h3>Mis Citas</h3>
                    <div id="apt-list"></div>
                </div>
            </div>
            <div id="info" class="pane">
                <div class="section">
                    <h3>Registrar Info</h3>
                    <form onsubmit="addInfo(event)">
                        <div class="form-group">
                            <label>Prospecto</label>
                            <select id="ip" required><option value="">Selecciona...</option></select>
                        </div>
                        <div class="form-group">
                            <label>Resultado</label>
                            <select id="ir" required>
                                <option value="">Selecciona...</option>
                                <option value="Inscripción">Inscripción</option>
                                <option value="Promesa">Promesa</option>
                                <option value="Apartado">Apartado</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">Registrar</button>
                    </form>
                </div>
                <div class="section">
                    <h3>Registradas</h3>
                    <div id="info-list"></div>
                </div>
            </div>
            <div id="close" class="pane">
                <div class="section">
                    <h3>Registrar Cierre</h3>
                    <form onsubmit="addClose(event)">
                        <div class="form-group">
                            <label>Prospecto</label>
                            <select id="clp" required><option value="">Selecciona...</option></select>
                        </div>
                        <div class="form-group">
                            <label>Tipo</label>
                            <select id="clt" required onchange="showFields()">
                                <option value="">Selecciona...</option>
                                <option value="Inscripción">Inscripción</option>
                                <option value="Apartado">Apartado</option>
                            </select>
                        </div>
                        <div class="form-group" id="pf" style="display:none">
                            <label>Plan</label>
                            <select id="clplan"><option>A</option><option>AMSI</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select>
                        </div>
                        <div class="form-group" id="af" style="display:none">
                            <label>Monto</label>
                            <input type="number" id="clamt" min="0" step="0.01">
                        </div>
                        <button type="submit" class="btn">Registrar</button>
                    </form>
                </div>
                <div class="section">
                    <h3>Registrados</h3>
                    <div id="close-list"></div>
                </div>
            </div>
            <div id="admin" class="pane">
                <div class="section">
                    <h3>Crear Vendedor</h3>
                    <form onsubmit="addVendor(event)">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" id="vn" required>
                        </div>
                        <div class="form-group">
                            <label>Código</label>
                            <input type="text" id="vc" required>
                        </div>
                        <button type="submit" class="btn">Crear</button>
                    </form>
                </div>
                <div class="section">
                    <h3>Métricas</h3>
                    <table>
                        <thead><tr><th>Vendedor</th><th>Pros</th><th>Cier</th><th>%</th></tr></thead>
                        <tbody id="admin-table"></tbody>
                    </table>
                </div>
                <div class="section">
                    <h3>Sincronizar Datos</h3>
                    <button class="btn btn-secondary" onclick="exportData()">📤 Exportar Datos</button>
                    <button class="btn btn-secondary" onclick="showImportForm()">📥 Importar Datos</button>
                    <div id="export-box"></div>
                    <div id="import-box" style="display:none;margin-top:12px">
                        <textarea id="import-data" placeholder="Pega aquí los datos exportados..." style="width:100%;height:100px;padding:8px;border:1px solid #e5e5ea;border-radius:8px;font-family:monospace;font-size:11px"></textarea>
                        <button class="btn" onclick="importData()" style="margin-top:8px">Importar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let user = null;
        let db = JSON.parse(localStorage.getItem('ingles_db') || '{"vendors":[{"name":"Juan","code":"001"},{"name":"María","code":"002"}],"prospects":[],"calls":[],"appointments":[],"infos":[],"closures":[]}');
        
        function save(){localStorage.setItem('ingles_db',JSON.stringify(db));}
        
        function switchMode(m){
            document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.mode').forEach(d=>d.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(m+'-mode').classList.add('active');
        }
        
        function loginVendor(){
            const name=document.getElementById('vname').value.trim();
            const code=document.getElementById('vcode').value.trim();
            if(!name||!code){showMsg('Completa los campos','error');return;}
            if(!db.vendors.find(v=>v.code===code)){showMsg('Código incorrecto','error');return;}
            user={name,code,type:'vendor'};
            showApp();
        }
        
        function loginAdmin(){
            if(document.getElementById('apass').value!=='admin123'){showMsg('Contraseña incorrecta','error');return;}
            user={name:'Admin',type:'admin'};
            showApp();
        }
        
        function showApp(){
            document.getElementById('login').classList.remove('active');
            document.getElementById('app').classList.add('active');
            document.getElementById('user').textContent=user.name;
            if(user.type==='admin'){
                document.getElementById('nav').style.display='none';
                tab('admin');
            }else{
                updateUI();
            }
        }
        
        function tab(name){
            document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
            if(name!=='reg')updateUI();
            if(name==='admin')loadAdmin();
        }
        
        function addProspect(e){
            e.preventDefault();
            db.prospects.push({id:Date.now(),vendor:user.code,name:document.getElementById('pn').value,phone:document.getElementById('pp').value});
            save();
            showMsg('✓ Prospecto registrado','success');
            e.target.reset();
            updateUI();
        }
        
        function addCall(e){
            e.preventDefault();
            const pid=document.getElementById('cp').value;
            const p=db.prospects.find(x=>x.id==pid);
            if(!p){showMsg('Selecciona prospecto','error');return;}
            db.calls.push({id:Date.now(),vendor:user.code,pid,pname:p.name,result:document.getElementById('cr').value});
            save();
            showMsg('✓ Llamada registrada','success');
            e.target.reset();
            updateUI();
        }
        
        function addApt(e){
            e.preventDefault();
            const pid=document.getElementById('ap').value;
            const p=db.prospects.find(x=>x.id==pid);
            if(!p){showMsg('Selecciona prospecto','error');return;}
            db.appointments.push({id:Date.now(),vendor:user.code,pid,pname:p.name,date:document.getElementById('ad').value,time:document.getElementById('at').value,type:document.getElementById('atype').value});
            save();
            showMsg('✓ Cita agendada','success');
            e.target.reset();
            updateUI();
        }
        
        function addInfo(e){
            e.preventDefault();
            const pid=document.getElementById('ip').value;
            const p=db.prospects.find(x=>x.id==pid);
            if(!p){showMsg('Selecciona prospecto','error');return;}
            db.infos.push({id:Date.now(),vendor:user.code,pid,pname:p.name,result:document.getElementById('ir').value});
            save();
            showMsg('✓ Info registrada','success');
            e.target.reset();
            updateUI();
        }
        
        function showFields(){
            const t=document.getElementById('clt').value;
            document.getElementById('pf').style.display=t==='Inscripción'?'block':'none';
            document.getElementById('af').style.display=t==='Apartado'?'block':'none';
        }
        
        function addClose(e){
            e.preventDefault();
            const pid=document.getElementById('clp').value;
            const p=db.prospects.find(x=>x.id==pid);
            if(!p){showMsg('Selecciona prospecto','error');return;}
            const type=document.getElementById('clt').value;
            db.closures.push({id:Date.now(),vendor:user.code,pid,pname:p.name,type,plan:type==='Inscripción'?document.getElementById('clplan').value:null,amount:type==='Apartado'?parseFloat(document.getElementById('clamt').value)||0:0});
            save();
            showMsg('✓ Cierre registrado','success');
            e.target.reset();
            updateUI();
        }
        
        function addVendor(e){
            e.preventDefault();
            const code=document.getElementById('vc').value.trim();
            if(db.vendors.find(v=>v.code===code)){showMsg('Código ya existe','error');return;}
            db.vendors.push({name:document.getElementById('vn').value,code});
            save();
            showMsg('✓ Vendedor creado','success');
            e.target.reset();
            loadAdmin();
        }
        
        function updateUI(){
            const p=db.prospects.filter(x=>x.vendor===user.code);
            const c=db.calls.filter(x=>x.vendor===user.code);
            const a=db.appointments.filter(x=>x.vendor===user.code);
            const i=db.infos.filter(x=>x.vendor===user.code);
            const cl=db.closures.filter(x=>x.vendor===user.code);
            
            document.getElementById('pros-list').innerHTML=p.length?p.map(x=>`<div class="item"><h4>${x.name}</h4><p>Tel: ${x.phone}</p></div>`).join(''):'<div class="empty">Sin prospectos</div>';
            document.getElementById('calls-list').innerHTML=c.length?c.map(x=>`<div class="item"><h4>${x.pname}</h4><p>${x.result}</p></div>`).join(''):'<div class="empty">Sin llamadas</div>';
            document.getElementById('apt-list').innerHTML=a.length?a.map(x=>`<div class="item"><h4>${x.pname}</h4><p>${x.date} ${x.time} (${x.type})</p></div>`).join(''):'<div class="empty">Sin citas</div>';
            document.getElementById('info-list').innerHTML=i.length?i.map(x=>`<div class="item"><h4>${x.pname}</h4><p>${x.result}</p></div>`).join(''):'<div class="empty">Sin infos</div>';
            document.getElementById('close-list').innerHTML=cl.length?cl.map(x=>`<div class="item"><h4>${x.pname}</h4><p>${x.type}${x.type==='Inscripción'?` - Plan ${x.plan}`:` - $${x.amount}`}</p></div>`).join(''):'<div class="empty">Sin cierres</div>';
            
            const popts=p.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
            document.getElementById('cp').innerHTML='<option value="">Selecciona...</option>'+popts;
            document.getElementById('ap').innerHTML='<option value="">Selecciona...</option>'+popts;
            document.getElementById('clp').innerHTML='<option value="">Selecciona...</option>'+popts;
            
            const aopts=a.map(x=>`<option value="${x.pid}">${x.pname}</option>`).join('');
            document.getElementById('ip').innerHTML='<option value="">Selecciona...</option>'+aopts;
        }
        
        function loadAdmin(){
            let html='';
            db.vendors.forEach(v=>{
                const vp=db.prospects.filter(x=>x.vendor===v.code).length;
                const vc=db.closures.filter(x=>x.vendor===v.code).length;
                const pct=vp>0?Math.round((vc/vp)*100):0;
                html+=`<tr><td>${v.name}</td><td>${vp}</td><td>${vc}</td><td>${pct}%</td></tr>`;
            });
            document.getElementById('admin-table').innerHTML=html||'<tr><td colspan="4" class="empty">Sin vendedores</td></tr>';
        }
        
        function exportData(){
            const code=btoa(JSON.stringify(db));
            document.getElementById('export-box').innerHTML=`<div class="sync-code">📋 Código:<br>${code}</div><p style="font-size:11px;color:#999">Copia este código y comparte con otros dispositivos para sincronizar datos</p>`;
        }
        
        function showImportForm(){
            document.getElementById('import-box').style.display=document.getElementById('import-box').style.display==='none'?'block':'none';
        }
        
        function importData(){
            try{
                const code=document.getElementById('import-data').value.trim();
                const imported=JSON.parse(atob(code));
                if(imported.vendors&&imported.prospects){
                    db=imported;
                    save();
                    showMsg('✓ Datos importados','success');
                    loadAdmin();
                    document.getElementById('import-box').style.display='none';
                    document.getElementById('import-data').value='';
                }else{
                    showMsg('Código inválido','error');
                }
            }catch(e){
                showMsg('Error: '+e.message,'error');
            }
        }
        
        function logout(){
            user=null;
            document.getElementById('login').classList.add('active');
            document.getElementById('app').classList.remove('active');
            document.getElementById('vname').value='';
            document.getElementById('vcode').value='';
            document.getElementById('apass').value='';
        }
        
        function showMsg(m,t){
            const msg=document.getElementById('msg');
            msg.textContent=m;
            msg.className='msg show '+t;
            setTimeout(()=>msg.classList.remove('show'),3000);
        }
    </script>
</body>
</html>
